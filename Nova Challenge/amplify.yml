version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd "Nova Challenge/frontend" && npm install
    build:
      commands:
        - cd "Nova Challenge/frontend" && echo "REACT_APP_API_URL=https://c2kxx0qry9.execute-api.eu-west-2.amazonaws.com" > .env && npm run build
  artifacts:
    baseDirectory: "Nova Challenge/frontend/build"
    files:
      - '**/*'
  cache:
    paths:
      - "Nova Challenge/frontend/node_modules/**/*"
