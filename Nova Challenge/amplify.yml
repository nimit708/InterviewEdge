version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd "Nova Challenge/frontend" && npm install
    build:
      commands:
        - ls
        - pwd
        - ls "Nova Challenge" 2>/dev/null || ls "Nova Challenge/frontend" 2>/dev/null || echo "NOT FOUND"
        - cd "Nova Challenge/frontend" && npm run build
  artifacts:
    baseDirectory: "Nova Challenge/frontend/build"
    files:
      - '**/*'
  cache:
    paths:
      - "Nova Challenge/frontend/node_modules/**/*"
